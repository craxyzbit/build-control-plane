name: Build

on:
  workflow_dispatch:
    inputs:
      project:
        description: Project contract name under projects/
        required: true
        type: string
      openwrt_channel:
        description: OpenWrt channel for the openwrt project
        required: false
        default: stable
        type: choice
        options:
          - stable
          - snapshot
      openwrt_version:
        description: OpenWrt version when channel=stable, for example 25.12.3
        required: false
        default: 25.12.3
        type: string
      openwrt_target:
        description: OpenWrt target to run in this workflow
        required: false
        default: qemu-x86-64
        type: choice
        options:
          - qemu-x86-64
          - nanopi-r2s-arm64
      private_plan_b64:
        description: Optional base64-encoded private plan for non-secret operator preferences
        required: false
        type: string
      openwrt_auto_fetch:
        description: Clone or refresh OpenWrt source automatically during pipeline run
        required: false
        default: false
        type: boolean
      openwrt_execute_build:
        description: Execute generated OpenWrt build commands when a source tree is available
        required: false
        default: false
        type: boolean
      openwrt_execute_collect:
        description: Collect build artifacts after a successful OpenWrt build
        required: false
        default: false
        type: boolean
      openwrt_build_jobs:
        description: Optional job count passed to OpenWrt make
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space for OpenWrt builds
        if: inputs.project == 'openwrt' && inputs.openwrt_execute_build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install OpenWrt build prerequisites
        if: inputs.project == 'openwrt' && (inputs.openwrt_execute_build || inputs.openwrt_execute_collect)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler file flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man intltool libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool lrzsz msmtp ninja-build p7zip p7zip-full pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev

      - name: Prepare shell permissions
        run: chmod +x scripts/run.sh scripts/pipeline/*.sh

      - name: Execute pipeline
        env:
          PROJECT: ${{ inputs.project }}
          OPENWRT_CHANNEL: ${{ inputs.openwrt_channel }}
          OPENWRT_VERSION: ${{ inputs.openwrt_version }}
          OPENWRT_TARGETS: ${{ inputs.openwrt_target }}
          PRIVATE_PLAN_B64: ${{ inputs.private_plan_b64 }}
          OPENWRT_AUTO_FETCH: ${{ inputs.openwrt_auto_fetch }}
          OPENWRT_EXECUTE_BUILD: ${{ inputs.openwrt_execute_build }}
          OPENWRT_EXECUTE_COLLECT: ${{ inputs.openwrt_execute_collect }}
          OPENWRT_BUILD_JOBS: ${{ inputs.openwrt_build_jobs }}
        run: ./scripts/run.sh

      - name: Publish summary
        if: always()
        run: |
          if [ -f "dist/${{ inputs.project }}/plans/summary.txt" ]; then
            cat "dist/${{ inputs.project }}/plans/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload public diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-public-diagnostics-${{ github.run_id }}
          path: dist/${{ inputs.project }}/public-diagnostics
          if-no-files-found: warn

      - name: Upload OpenWrt release artifacts
        if: success() && inputs.project == 'openwrt' && inputs.openwrt_execute_collect
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.openwrt_target }}-${{ inputs.openwrt_version }}-${{ github.run_id }}
          path: dist/${{ inputs.project }}/releases/${{ inputs.openwrt_target }}
          if-no-files-found: error
